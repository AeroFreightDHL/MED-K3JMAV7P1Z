<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AeroFreight Shipment Tracking</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eaf4ff,#f5efff,#ecfff5);min-height:100vh;display:grid;place-items:center;padding:22px;color:#172033}.card{max-width:620px;width:100%;background:#fff;border-radius:24px;padding:34px;box-shadow:0 18px 50px #24324a22}.logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#1769ff,#7c3aed);display:grid;place-items:center;color:#fff;font-weight:800;font-size:25px;margin-bottom:18px}h1{margin:0 0 10px}p{color:#64748b;line-height:1.55}.label{display:block;font-weight:700;margin:24px 0 8px}input{width:100%;padding:17px;border:2px solid #dbe3ef;border-radius:14px;font-size:17px}button{width:100%;margin-top:14px;padding:17px;border:0;border-radius:14px;background:linear-gradient(135deg,#1769ff,#7c3aed);color:white;font-size:17px;font-weight:700}.note{margin-top:22px;padding:15px;border-radius:14px;background:#f8fafc;font-size:13px;color:#64748b}.error{display:none;margin-top:12px;color:#b91c1c;background:#fef2f2;padding:12px;border-radius:10px}</style></head><body><div class="card"><div class="logo" aria-label="Airplane">✈</div><h1>AeroFreight Shipment Tracking</h1><p>Enter your AeroFreight tracking reference to view the shipment details.</p><form id="trackForm"><label class="label" for="code">Tracking reference</label><input id="code" placeholder="" required><button type="submit">Track Shipment</button><div id="error" class="error">Tracking reference not found. Please check the code.</div></form></div><script>document.getElementById('trackForm').addEventListener('submit',function(e){e.preventDefault();const c=document.getElementById('code').value.trim().toUpperCase();if(c==='MED-K3JMAV7P1Z'){location.href='tracking-details.html?code='+encodeURIComponent(c)}else document.getElementById('error').style.display='block'});</script></body></html>
